
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz de maths avec voix</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:18px;font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#dff4ff,#f0e5ff);
  color:#25304a
}
.container{
  max-width:760px;margin:15px auto;background:white;
  border-radius:24px;padding:25px;
  box-shadow:0 8px 28px #2222
}
h1{text-align:center;color:#5944c8}
.intro{text-align:center;color:#687086;line-height:1.5}
.progress-bg{height:12px;background:#eee;border-radius:20px;overflow:hidden;margin:22px 0}
#progress{height:100%;width:0;background:#7056dc;transition:.3s}
.info{display:flex;justify-content:space-between;gap:10px;font-weight:bold;color:#5944c8}
#question{font-size:1.4rem;line-height:1.5;margin:25px 0}
button{font-family:inherit;cursor:pointer}
.voice{
  border:0;background:#087fa5;color:white;padding:13px 18px;
  border-radius:12px;font-size:1rem;font-weight:bold;margin-bottom:16px
}
.voice:hover{background:#066783}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.option{
  padding:17px;background:#f4f1ff;border:2px solid #e0d9ff;
  border-radius:13px;font-size:1.1rem;text-align:left
}
.option:hover:not(:disabled){background:#e7e1ff}
.option:disabled{cursor:default;opacity:1}
.option.correct{background:#d9f8e4;border-color:#2ba568}
.option.wrong{background:#ffe1e1;border-color:#e45151}
#feedback{display:none;padding:15px;border-radius:12px;margin-top:18px;line-height:1.5}
#feedback.show{display:block}
.good{background:#e0f8e9;color:#17663c}
.bad{background:#fff0dd;color:#854d0e}
.actions{display:flex;gap:12px;justify-content:space-between;margin-top:20px;flex-wrap:wrap}
.main{border:0;background:#6250d5;color:white;padding:14px 20px;border-radius:12px;font-size:1rem;font-weight:bold}
.main:disabled{opacity:.5;cursor:not-allowed}
#result{text-align:center;display:none}
.big{font-size:3rem;color:#5944c8;font-weight:bold;margin:20px}
.review{text-align:left;background:#f7f5ff;padding:15px;border-radius:12px;line-height:1.6}
.small{color:#687086;font-size:.9rem}
@media(max-width:520px){
 .container{padding:17px}
 .options{grid-template-columns:1fr}
 #question{font-size:1.2rem}
}
</style>
</head>
<body>
<div class="container">
  <h1>🔢 Mon quiz de maths</h1>
  <p class="intro">
    1re année de l'école primaire<br>
    Écoute la question, réfléchis et choisis la bonne réponse !
  </p>

  <div id="quiz">
    <div class="progress-bg"><div id="progress"></div></div>
    <div class="info">
      <span id="counter">Question 1 / 20</span>
      <span id="score">⭐ 0 point</span>
    </div>

    <div id="question"></div>

    <button class="voice" onclick="readQuestion()">
      🔊 Écouter la question
    </button>
    <button class="voice" onclick="readAnswers()">
      🗣️ Écouter les réponses
    </button>

    <div class="options" id="options"></div>
    <div id="feedback" role="status" aria-live="polite"></div>

    <div class="actions">
      <button class="main" id="hintBtn" onclick="showHint()">💡 Indice</button>
      <button class="main" id="nextBtn" onclick="nextQuestion()" disabled>
        Suivant ➜
      </button>
    </div>
    <p id="hint" class="small"></p>
  </div>

  <div id="result">
    <h2>🎉 Bravo ! Tu as terminé !</h2>
    <div class="big" id="finalScore"></div>
    <p id="message"></p>
    <button class="main" onclick="restart()">🔄 Recommencer</button>
    <div class="review" id="review"></div>
  </div>
</div>

<script>
const questions = [
 {q:"Combien font 1 plus 2 ?",o:["2","3","4","5"],a:1,h:"Compte un objet puis ajoute deux objets.",e:"1 plus 2 égale 3."},
 {q:"Combien font 3 plus 2 ?",o:["4","5","6","3"],a:1,h:"Pars de trois et compte deux nombres de plus.",e:"3 plus 2 égale 5."},
 {q:"Combien font 5 moins 3 ?",o:["1","3","2","4"],a:2,h:"Enlève trois objets à un groupe de cinq.",e:"5 moins 3 égale 2."},
 {q:"Quel nombre vient après 9 ?",o:["8","10","11","7"],a:1,h:"Compte un nombre de plus après neuf.",e:"Après 9 vient 10."},
 {q:"Quel est le plus grand nombre : 2, 6, 4 ou 5 ?",o:["2","6","4","5"],a:1,h:"Compare les nombres en comptant.",e:"6 est le plus grand nombre."},
 {q:"Combien font 4 plus 4 ?",o:["6","7","8","9"],a:2,h:"Ajoute quatre objets à quatre autres.",e:"4 plus 4 égale 8."},
 {q:"Combien font 8 moins 1 ?",o:["6","7","8","9"],a:1,h:"Quel nombre vient juste avant huit ?",e:"8 moins 1 égale 7."},
 {q:"Quel est le plus petit nombre : 3, 1, 7 ou 5 ?",o:["3","1","7","5"],a:1,h:"Cherche le nombre qui vient en premier quand tu comptes.",e:"1 est le plus petit nombre."},
 {q:"Complète la suite : 4, 5, 6, puis quel nombre ?",o:["8","7","9","5"],a:1,h:"Chaque nombre augmente de un.",e:"Après 6 vient 7."},
 {q:"Combien font 2 plus 6 ?",o:["7","9","8","6"],a:2,h:"Pars de six et compte deux nombres de plus.",e:"2 plus 6 égale 8."},
 {q:"Tom a 4 voitures-jouets. Il en reçoit 1 autre. Combien en a-t-il ?",o:["4","6","5","3"],a:2,h:"Ajoute la nouvelle voiture aux quatre premières.",e:"4 plus 1 égale 5 voitures."},
 {q:"Combien de côtés a un rectangle ?",o:["3","4","5","2"],a:1,h:"Compte les bords de cette forme.",e:"Un rectangle a 4 côtés."},
 {q:"Combien font 7 plus 2 ?",o:["8","10","9","6"],a:2,h:"Pars de sept et avance de deux nombres.",e:"7 plus 2 égale 9."},
 {q:"Quel nombre vient juste avant 6 ?",o:["7","5","4","8"],a:1,h:"Compte à rebours : 6, puis le nombre précédent.",e:"Le nombre avant 6 est 5."},
 {q:"Combien de coins a un carré ?",o:["3","5","4","6"],a:2,h:"Compte les coins de la forme.",e:"Un carré a 4 coins."},
 {q:"Combien font 9 moins 4 ?",o:["4","6","5","3"],a:2,h:"Enlève quatre objets à neuf objets.",e:"9 moins 4 égale 5."},
 {q:"Emma a 3 fleurs. Son amie lui donne 2 fleurs. Combien a-t-elle de fleurs ?",o:["4","6","5","3"],a:2,h:"Réunis les deux groupes de fleurs.",e:"3 plus 2 égale 5 fleurs."},
 {q:"Complète la suite : 2, 4, 6, puis quel nombre ?",o:["7","8","9","5"],a:1,h:"Les nombres augmentent de deux à chaque fois.",e:"Après 6 vient 8 dans cette suite."},
 {q:"Combien font 10 moins 2 ?",o:["7","9","8","6"],a:2,h:"Enlève deux objets à un groupe de dix.",e:"10 moins 2 égale 8."},
 {q:"Il y a 5 oiseaux sur un arbre. 2 autres arrivent. Combien y a-t-il d'oiseaux ?",o:["6","8","7","5"],a:2,h:"Ajoute les deux oiseaux aux cinq déjà présents.",e:"5 plus 2 égale 7 oiseaux."}
];
let current=0, points=0, answered=false, results=[];

function speak(text){
  if(!("speechSynthesis" in window)){
    alert("La lecture vocale n'est pas disponible dans ce navigateur.");
    return;
  }
  speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang="fr-FR";
  utterance.rate=0.82;
  utterance.pitch=1.08;
  const voices=speechSynthesis.getVoices();
  const frenchVoice=voices.find(v=>v.lang.toLowerCase().startsWith("fr"));
  if(frenchVoice) utterance.voice=frenchVoice;
  speechSynthesis.speak(utterance);
}

function readQuestion(){
  speak("Question "+(current+1)+". "+questions[current].q);
}
function readAnswers(){
  const q=questions[current];
  speak("Les réponses possibles sont : "+q.o.map((v,i)=>
    ["A","B","C","D"][i]+". "+v
  ).join(". "));
}
function render(){
  answered=false;
  const item=questions[current];
  document.getElementById("counter").textContent=
    "Question "+(current+1)+" / "+questions.length;
  document.getElementById("score").textContent="⭐ "+points+" point(s)";
  document.getElementById("progress").style.width=
    (current/questions.length*100)+"%";
  document.getElementById("question").textContent=item.q;
  document.getElementById("hint").textContent="";
  document.getElementById("feedback").className="";
  document.getElementById("feedback").textContent="";
  document.getElementById("nextBtn").disabled=true;
  document.getElementById("hintBtn").disabled=false;
  document.getElementById("nextBtn").textContent=
    current===questions.length-1?"Voir mon résultat 🎉":"Suivant ➜";

  const box=document.getElementById("options");
  box.innerHTML="";
  item.o.forEach((answer,i)=>{
    const btn=document.createElement("button");
    btn.className="option";
    btn.textContent=["A","B","C","D"][i]+". "+answer;
    btn.onclick=()=>choose(i);
    box.appendChild(btn);
  });
}
function choose(i){
  if(answered)return;
  answered=true;
  speechSynthesis?.cancel();
  const item=questions[current];
  document.querySelectorAll(".option").forEach((b,j)=>{
    b.disabled=true;
    if(j===item.a)b.classList.add("correct");
    if(j===i&&i!==item.a)b.classList.add("wrong");
  });
  const fb=document.getElementById("feedback");
  fb.textContent=(i===item.a?"🎉 Bravo ! ":"🙂 Continue à apprendre ! ")+item.e;
  fb.className="show "+(i===item.a?"good":"bad");
  if(i===item.a)points++;
  results.push({q:item.q,answer:item.o[item.a],correct:i===item.a});
  document.getElementById("score").textContent="⭐ "+points+" point(s)";
  document.getElementById("nextBtn").disabled=false;
  document.getElementById("hintBtn").disabled=true;
  document.getElementById("progress").style.width=
    ((current+1)/questions.length*100)+"%";
  speak((i===item.a?"Bravo ! ":"Ce n'est pas la bonne réponse. ")+item.e);
}
function showHint(){
  document.getElementById("hint").textContent="💡 "+questions[current].h;
  document.getElementById("hintBtn").disabled=true;
  speak(questions[current].h);
}
function nextQuestion(){
  if(!answered)return;
  current++;
  if(current<questions.length)render();
  else finish();
}
function finish(){
  document.getElementById("quiz").style.display="none";
  document.getElementById("result").style.display="block";
  document.getElementById("finalScore").textContent=points+" / 20";
  const message=points>=18?"Fantastique ! Tu es un champion des maths !":
    points>=14?"Très bien ! Continue comme ça !":
    points>=10?"Bon travail ! Entraîne-toi encore un peu !":
    "Courage ! Tu peux recommencer pour progresser !";
  document.getElementById("message").textContent=message;
  document.getElementById("review").innerHTML="<h3>Mes réponses</h3>"+
    results.map((r,i)=>`<p>${r.correct?"✅":"❌"} ${i+1}. ${r.q}<br>
    <strong>Bonne réponse : ${r.answer}</strong></p>`).join("");
  speak("Quiz terminé ! Tu as obtenu "+points+" points sur 20. "+message);
}
function restart(){
  speechSynthesis?.cancel();
  current=0;points=0;answered=false;results=[];
  document.getElementById("result").style.display="none";
  document.getElementById("quiz").style.display="block";
  render();
}
if("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged=()=>{};
}
render();

</script>

</script>
</body>
</html>
